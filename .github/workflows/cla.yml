# Contributor License Agreement (CLA.md). On a contributor's first pull
# request the bot asks them to sign with one comment; signatures are stored
# on the cla-signatures branch (kept unprotected so the bot can write there).
# pull_request_target is safe here: the action never checks out PR code.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: larslyse,dependabot[bot],github-actions[bot],claude[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            (you keep your copyright; it lets the project keep its licensing options open)
            and sign it by posting the comment below. You only need to do this once.
